name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: 格式 / lint / 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui-react/package-lock.json

      - name: 构建前端（ui-react）
        # src-tauri 的 generate_context! 宏在编译期读取 tauri.conf.json 的
        # frontendDist（../ui-react/dist，gitignore 不入库），必须先构建出来。
        working-directory: ui-react
        run: |
          npm ci
          npm run build

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: 安装 Tauri 编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            file

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 测试
        run: cargo test --workspace

  frontend:
    name: 前端与演示内核检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 构建并检查 React 前端（ui-react）
        working-directory: ui-react
        run: |
          npm ci
          npm run build

      - name: 校验演示内核（WebAssembly）
        run: node tools/verify_core_wasm.mjs

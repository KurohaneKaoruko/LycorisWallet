name: Release

# 打 tag 即发布：git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空则取 Cargo.toml 里的版本）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  # 带上 sha：同一个 tag 被修正重推时，新任务不会被旧任务挡住
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI_VERSION: "^2"

jobs:
  version:
    name: 校验版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        name: 比对 tag / Cargo.toml / tauri.conf.json
        run: |
          set -euo pipefail
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          tauri_version="$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"

          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$cargo_version"
          fi

          if [ "$version" != "$cargo_version" ] || [ "$version" != "$tauri_version" ]; then
            echo "::error::版本号不一致：发布=$version Cargo.toml=$cargo_version tauri.conf.json=$tauri_version"
            echo "::error::请先同步 Cargo.toml 的 [workspace.package] version 与 src-tauri/tauri.conf.json 的 version"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "发布版本 $version"

  build:
    name: 构建 ${{ matrix.asset }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: windows-x64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: macos-arm64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: linux-x64
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: 安装 Tauri CLI
        # Windows 默认 PowerShell 不会展开 $TAURI_CLI_VERSION（环境变量要用
        # $env:…），统一用 bash 执行，三个平台行为一致。
        shell: bash
        run: cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked

      - name: 安装 Linux 打包依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            build-essential \
            file

      - name: 生成各平台图标
        # macOS 需要 icon.icns，仓库里没有提交，用 1024×1024 的源图现场生成
        run: cargo tauri icon src-tauri/icons/icon.png

      - name: 打包
        run: cargo tauri build --target ${{ matrix.target }}

      - name: 收集并重命名发行文件
        shell: bash
        # 显式用 bash 调用，脚本的执行位在 Windows 上提交时可能丢失
        run: bash .github/scripts/stage-assets.sh "${{ needs.version.outputs.version }}" "${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.asset }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: 发布发行版
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 手动触发时补打 tag
        if: github.ref_type != 'tag'
        run: |
          set -euo pipefail
          tag="v${{ needs.version.outputs.version }}"
          git tag -a "$tag" -m "Lycoris Wallet $tag"
          git push origin "$tag"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: 下载各平台产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bundle-*
          merge-multiple: true

      - name: 列出发行文件
        run: ls -lh dist

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Lycoris Wallet v${{ needs.version.outputs.version }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.version.outputs.version) }}
          body: |
            Lycoris Wallet v${{ needs.version.outputs.version }}

            下载对应平台的安装包（文件名均带版本号）：

            | 平台 | 文件 |
            | --- | --- |
            | Windows x64 | `LycorisWallet_${{ needs.version.outputs.version }}_x64-setup.exe` |
            | macOS Apple Silicon | `LycorisWallet_${{ needs.version.outputs.version }}_arm64.dmg` |
            | macOS Intel | `LycorisWallet_${{ needs.version.outputs.version }}_x64.dmg` |
            | Linux x64 | `LycorisWallet_${{ needs.version.outputs.version }}_amd64.AppImage` |
            | Linux x64 (deb) | `LycorisWallet_${{ needs.version.outputs.version }}_amd64.deb` |

            未签名的 macOS 包首次打开需要在「系统设置 → 隐私与安全性」中放行。
          files: dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

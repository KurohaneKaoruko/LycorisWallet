<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Lycoris Wallet</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles/theme.css?v=6" />
    <link rel="stylesheet" href="styles/app.css?v=6" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <div id="app" data-view="boot">
      <header class="titlebar" data-tauri-drag-region>
        <div class="tb-brand" data-tauri-drag-region>
          <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="15" fill="none" stroke="currentColor" stroke-opacity=".18" />
            <g fill="var(--vermilion)">
              <ellipse cx="16" cy="9.2" rx="2.6" ry="5.2" />
              <ellipse cx="16" cy="9.2" rx="2.6" ry="5.2" transform="rotate(72 16 16)" />
              <ellipse cx="16" cy="9.2" rx="2.6" ry="5.2" transform="rotate(144 16 16)" />
              <ellipse cx="16" cy="9.2" rx="2.6" ry="5.2" transform="rotate(216 16 16)" />
              <ellipse cx="16" cy="9.2" rx="2.6" ry="5.2" transform="rotate(288 16 16)" />
            </g>
            <circle cx="16" cy="16" r="2.4" fill="var(--ink)" />
          </svg>
          <span class="tb-title">Lycoris Wallet</span>
        </div>
        <div class="tb-center" id="tb-center" data-tauri-drag-region></div>
        <div class="tb-actions">
          <span class="chip chip-mock" id="mock-chip" hidden>演示模式</span>
          <button class="tb-btn" id="btn-lock" type="button" title="立即锁定" hidden>
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M6 9V7.2a4 4 0 1 1 8 0V9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
              <rect x="4.4" y="9" width="11.2" height="8.2" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.6" />
            </svg>
          </button>
          <div class="win-controls">
            <button class="win-btn" id="win-min" type="button" title="最小化" aria-label="最小化">
              <svg viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.2" /></svg>
            </button>
            <button class="win-btn" id="win-max" type="button" title="最大化" aria-label="最大化">
              <svg viewBox="0 0 12 12"><rect x="2.4" y="2.4" width="7.2" height="7.2" rx="1" fill="none" stroke="currentColor" stroke-width="1.2" /></svg>
            </button>
            <button class="win-btn win-close" id="win-close" type="button" title="关闭" aria-label="关闭">
              <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.2" /></svg>
            </button>
          </div>
        </div>
      </header>
      <div class="shell">
        <nav class="rail" id="rail" hidden></nav>
        <main class="stage" id="stage">
          <div class="boot">
            <div class="boot-flower" aria-hidden="true"></div>
            <p>正在启动 Lycoris Wallet…</p>
          </div>
        </main>
      </div>
    </div>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
    <div id="modal-root"></div>
    <script type="module" src="js/main.js?v=6"></script>
  </body>
</html>
